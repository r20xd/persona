name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: deanery
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: test_deanery
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deanery -d test_deanery"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DB_NAME: test_deanery
      TEST_DB_USER: deanery
      TEST_DB_PASSWORD: ci-disposable-only
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: '5432'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py check --settings=config.settings.test
      - run: uv run python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest
