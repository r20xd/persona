[project]
name = "digital-deanery"
version = "0.1.0"
description = "Competition concept: student digital deanery"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Django>=5.2,<5.3",
  "psycopg>=3.2,<4",
  "argon2-cffi>=25.1,<26",
  "whitenoise>=6.9,<7",
  "gunicorn>=23,<24",
  "django-axes>=9,<10",
  "markdown-it-py>=4,<5",
]

[dependency-groups]
dev = ["psycopg[binary]>=3.2,<4", "pytest>=8,<10", "pytest-django>=4.11,<5", "ruff>=0.12,<1", "pytest-playwright>=0.7,<1"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests", "apps"]
addopts = "--strict-markers"
markers = ["browser: real Chromium tests of the local fictional preview"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]
